name: website
# builds site/ (with live data from the code) and publishes it to GitHub Pages
on:
  push:
    paths: ["site/**", "lib/**", "bin/**", "share/**", "tools/build-site.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/build-site.sh _site
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    # only the default branch goes live
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
